# ============================================================
# nginx.conf — Production: Daphne ASGI + WebSocket + nginx micro-cache
# Architecture: Cloudflare → nginx → Daphne (HTTP pool | WS pool)
#
# HTTP API   → daphne_http pool: 4 Daphne workers on ports 8001-8004
# WebSocket  → daphne_ws   pool: 2 dedicated workers on ports 8011-8012
#
# Nginx micro-cache (proxy_cache) for public anonymous GET responses.
# Django Redis DB2/3 handles app-level cache independently.
# Both layers run in tandem — nginx collapses repeated anonymous GETs
# before they reach Daphne; Django handles per-user private caching.
#
# ---- Daphne startup (run via systemd / supervisor) ----
# HTTP workers:
#   daphne -b 127.0.0.1 -p 8001 training_platform.asgi:application
#   daphne -b 127.0.0.1 -p 8002 training_platform.asgi:application
#   daphne -b 127.0.0.1 -p 8003 training_platform.asgi:application
#   daphne -b 127.0.0.1 -p 8004 training_platform.asgi:application
# WebSocket workers:
#   daphne -b 127.0.0.1 -p 8011 training_platform.asgi:application
#   daphne -b 127.0.0.1 -p 8012 training_platform.asgi:application
#
# ---- Add to parent nginx.conf http {} block ----
#   limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
#   limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=api_wallet:10m  rate=10r/m;
#
#   proxy_cache_path /var/cache/nginx/api
#       levels=1:2
#       keys_zone=api_cache:10m
#       max_size=1g
#       inactive=60s
#       use_temp_path=off;
# ============================================================

# ---- WebSocket upgrade map ----
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- Cache bypass: skip cache when Authorization header is present ----
map $http_authorization $bypass_cache {
    default 0;
    "~."    1;    # any non-empty Authorization → bypass nginx cache
}

# ===========================================================
# HTTP API upstream — 4 Daphne workers, least_conn load balancing
# ===========================================================
upstream daphne_http {
    least_conn;
    server 127.0.0.1:8001;
    server 127.0.0.1:8002;
    server 127.0.0.1:8003;
    server 127.0.0.1:8004;
    keepalive 128;
    keepalive_requests 1000;
    keepalive_timeout  60s;
}

# ===========================================================
# WebSocket upstream — 2 dedicated Daphne workers
# Separated so long-lived WS connections don't starve HTTP workers
# ===========================================================
upstream daphne_ws {
    least_conn;
    server 127.0.0.1:8011;
    server 127.0.0.1:8012;
    keepalive 64;
    keepalive_requests 500;
    keepalive_timeout  3600s;
}

# ===========================================================
# HTTPS server
# ===========================================================
server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    # ---- TLS ----
    ssl_certificate        /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key    /etc/ssl/private/privkey.pem;
    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_ciphers            ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache      shared:SSL:20m;
    ssl_session_timeout    1d;
    ssl_session_tickets    off;
    ssl_stapling           on;
    ssl_stapling_verify    on;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ---- Trusted proxy: Cloudflare IP ranges ----
    # Keep updated from: https://www.cloudflare.com/ips/
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ===========================================================
    # WebSocket endpoints — declared BEFORE /api/ to match first
    # Routed to dedicated daphne_ws pool (ports 8011-8012)
    # ===========================================================

    location /ws/social/ {
        proxy_pass         http://daphne_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
    }

    location /ws/ai/chat/ {
        proxy_pass         http://daphne_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ===========================================================
    # Auth — 5 req/min, NEVER cached
    # ===========================================================
    location ~ ^/api/auth/(login|register|otp|password) {
        limit_req        zone=api_auth burst=3 nodelay;
        limit_req_status 429;

        proxy_pass           http://daphne_http;
        proxy_http_version   1.1;
        proxy_set_header     Connection          "";
        proxy_set_header     Host                $host;
        proxy_set_header     X-Real-IP           $remote_addr;
        proxy_set_header     X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto   $scheme;
        proxy_read_timeout   30s;
        proxy_cache          off;
        add_header           Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ===========================================================
    # Wallet/financial — 10 req/min, NEVER cached
    # ===========================================================
    location /api/wallet/ {
        limit_req        zone=api_wallet burst=5 nodelay;
        limit_req_status 429;

        proxy_pass           http://daphne_http;
        proxy_http_version   1.1;
        proxy_set_header     Connection          "";
        proxy_set_header     Host                $host;
        proxy_set_header     X-Real-IP           $remote_addr;
        proxy_set_header     X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto   $scheme;
        proxy_read_timeout   30s;
        proxy_cache          off;
        add_header           Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ===========================================================
    # Public API — 60 req/min + nginx micro-cache (30s TTL)
    #
    # Caching behaviour:
    #   - Anonymous GET requests: cached for 30s at nginx level
    #   - Authenticated (Authorization header): bypassed — no nginx cache,
    #     falls through to Django which uses Redis DB2/3 per-user cache
    #   - POST/PUT/DELETE: never cached (proxy_cache_methods GET HEAD)
    #   - X-Cache-Status header indicates HIT/MISS/BYPASS for debugging
    # ===========================================================
    location /api/ {
        limit_req        zone=api_general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass           http://daphne_http;
        proxy_http_version   1.1;
        proxy_set_header     Connection          "";
        proxy_set_header     Host                $host;
        proxy_set_header     X-Real-IP           $remote_addr;
        proxy_set_header     X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto   $scheme;
        proxy_read_timeout   60s;

        # nginx micro-cache
        proxy_cache                 api_cache;
        proxy_cache_key             "$scheme$request_method$host$request_uri";
        proxy_cache_valid           200 30s;
        proxy_cache_valid           404 10s;
        proxy_cache_valid           any 0s;
        proxy_cache_methods         GET HEAD;
        proxy_cache_bypass          $bypass_cache $http_pragma;
        proxy_no_cache              $bypass_cache;
        proxy_cache_lock            on;
        proxy_cache_use_stale       error timeout updating;
        proxy_cache_background_update on;

        add_header X-Cache-Status   $upstream_cache_status always;
    }

    # ===========================================================
    # Static / Media — served by nginx only, Daphne never touched
    # ===========================================================
    location /static/ {
        alias       /app/staticfiles/;
        expires     1y;
        add_header  Cache-Control "public, immutable";
        gzip_static on;
    }

    location /media/ {
        alias      /app/media/;
        expires    7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Health check — no cache, no rate limit, no access log
    location /health/ {
        proxy_pass         http://daphne_http;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_cache        off;
        access_log         off;
    }
}

# ===========================================================
# HTTP → HTTPS redirect
# ===========================================================
server {
    listen      80;
    server_name api.yourdomain.com;
    return      301 https://$host$request_uri;
}

