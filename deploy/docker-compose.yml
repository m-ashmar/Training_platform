# The whole backend on ONE server: web, worker, beat, Postgres, Redis and HTTPS.
#
# This is the single-server deployment (DEPLOY_CHECKLIST.md section 12): the same image
# and the same three processes fly.toml runs, with Postgres and Redis beside them
# instead of at a provider, and Caddy in front for the certificate. It is NOT the
# development compose file at the repository root, which starts a test database only.
#
#   cd deploy
#   ./setup.sh                     # once: writes deploy/.env (every secret, mode 600)
#   docker compose build web       # the image (about ten minutes the first time)
#   docker compose up -d           # migrate, then start everything
#   docker compose ps -a           # migrate "Exited (0)", every other service "Up"/"healthy"
#                                  # (`-a`: plain `ps` hides the finished migrate container)
#
# What is deliberately so:
#   * Only Caddy publishes ports (80, 443). Postgres, Redis and Daphne are reachable
#     from this compose network and from nowhere else.
#   * `migrate` runs to completion BEFORE web, worker and beat start, as Fly's
#     release_command does. A failed migration leaves the old containers running.
#   * Exactly ONE beat. A second one sends every scheduled job twice.
#   * Media is object storage (MEDIA_BACKEND=s3), so no volume holds an upload and a
#     rebuilt server loses none. The volumes below are the database, Redis' queue, and
#     Caddy's certificates.
#   * Redis runs `noeviction` (training_platform/redis_layout.py): the job queue shares
#     this server with the caches, and an evicting Redis deletes queued jobs.
name: yallagym

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  image: yallagym-api:local
  env_file: .env
  environment: &app-env
    DJANGO_SETTINGS_MODULE: training_platform.settings_production
    DB_HOST: db
    DB_PORT: "5432"
    DB_NAME: ${DB_NAME:-yallagym}
    DB_USER: ${DB_USER:-yallagym}
    REDIS_URL: redis://:${REDIS_PASSWORD:?run ./setup.sh first}@redis:6379
    MEDIA_BACKEND: s3
    FILE_UPLOAD_TEMP_DIR: /tmp/uploads
    # One proxy of ours in front of Daphne: Caddy. It replaces any X-Forwarded-For a
    # client sends, so the single entry it writes is the client. Put a CDN in front
    # (Cloudflare's orange cloud) and this becomes 2.
    NUM_PROXIES: ${NUM_PROXIES:-1}
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

x-app-needs: &app-needs
  db:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  db:
    image: postgres:15
    restart: unless-stopped
    # More than Docker's default 64 MB /dev/shm: parallel queries ran out of it once and
    # the server restarted into recovery (SIDE_BUGS S-244).
    shm_size: 512mb
    environment:
      POSTGRES_DB: ${DB_NAME:-yallagym}
      POSTGRES_USER: ${DB_USER:-yallagym}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run ./setup.sh first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?run ./setup.sh first}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    environment:
      # For the healthcheck's redis-cli, so the password is not on a command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  migrate:
    <<: *app
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *app
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "training_platform.asgi:application"]
    depends_on: *app-needs
    expose:
      - "8000"
    healthcheck:
      # The Host header must be one ALLOWED_HOSTS accepts; the path is exempt from the
      # HTTPS redirect (settings_production.SECURE_REDIRECT_EXEMPT).
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          host = os.environ["DJANGO_ALLOWED_HOSTS"].split(",")[0].strip()
          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/auth/health/", headers={"Host": host})
          urllib.request.urlopen(request, timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    <<: *app
    command: ["celery", "-A", "training_platform", "worker", "--loglevel=info",
              "--concurrency=2", "--max-memory-per-child=200000"]
    depends_on: *app-needs

  beat:
    <<: *app
    command: ["celery", "-A", "training_platform", "beat", "--loglevel=info",
              "--schedule=/tmp/celerybeat-schedule"]
    depends_on: *app-needs

  caddy:
    # Newer Caddy releases close a connection that is silent for a minute. The
    # WebSockets are not silent: Daphne pings every 20 seconds by default.
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?run ./setup.sh first}
      ACME_EMAIL: ${ACME_EMAIL:?run ./setup.sh first}
    volumes:
      # The FOLDER, not the file: an editor replaces a file with a new one, and a
      # container that mounted the old file keeps reading the old one.
      - ./caddy:/etc/caddy:ro
      # The certificate and its account key. Losing this volume means asking Let's
      # Encrypt for a new certificate, and it limits how often it will issue one.
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
