[pytest]
# pytest-django was pinned in requirements.txt but never configured, so pytest had no
# settings module and collected nothing. Every probe in tests/security/ also built its
# own test database (~14s each, ~12 min for the suite); --reuse-db plus a session-scoped
# database means the regression gate below shares ONE database and runs in seconds.
DJANGO_SETTINGS_MODULE = training_platform.settings_local
python_files = test_*.py
testpaths = tests
addopts = --reuse-db --strict-markers -q
markers =
    slow: full standalone probe; run in the nightly job, not on every pull request
filterwarnings =
    ignore::DeprecationWarning
    ignore::django.utils.deprecation.RemovedInDjango60Warning
