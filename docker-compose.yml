
services:
  db:
    image: postgres:15
    # Postgres' parallel queries and several test databases built at once need more
    # than Docker's default 64 MB /dev/shm: on 2026-09-28 it ran out, the server
    # segfaulted and restarted into recovery with every database on it (SIDE_BUGS S-244).
    shm_size: 512mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=training_platform
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
