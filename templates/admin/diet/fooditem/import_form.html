{% extends "admin/base_site.html" %}

{% block content %}
<div class="content-main">
    <h1>{{ title }}</h1>
    
    <!-- SEARCH FORM -->
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="submit-row">
            <button type="submit" name="action" value="search" class="default">Search</button>
        </div>
    </form>

    <!-- RESULTS AND IMPORT FORM -->
    {% if results %}
    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="action" value="import">
        <h2>Results</h2>
        <ul>
            {% for item in results %}
                <li>
                    <label>
                        <!-- Use forloop.counter directly (starts at 1) -->
                        <input type="checkbox" name="selected_items" value="{{ forloop.counter }}">
                        <strong>{{ item.name }}</strong> - {{ item.calories }} kcal
                    </label>
                </li>
            {% endfor %}
        </ul>
        <div class="submit-row">
            <button type="submit" class="default">Import Selected</button>
        </div>
    </form>
    {% endif %}
</div>
{% endblock %}
