<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Generate Diet Plan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; }
        .card { max-width: 640px; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.25rem; }
        .row { display: flex; gap: 1rem; margin-bottom: 1rem; }
        label { font-weight: 600; }
        input { padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 8px; width: 100%; }
        button { background: #111827; color: white; border: 0; padding: 0.75rem 1rem; border-radius: 8px; cursor: pointer; }
        button:disabled { background: #6b7280; cursor: not-allowed; }
        .muted { color: #6b7280; font-size: 0.9rem; }
    </style>
    <script>
        async function submitGenerate(event) {
            event.preventDefault();
            const mealCount = parseInt(document.getElementById('meal_count').value || '3', 10);
            const snackCount = parseInt(document.getElementById('snack_count').value || '0', 10);
            const startDate = document.getElementById('start_date').value;
            const btn = document.getElementById('submit_btn');
            btn.disabled = true;
            btn.innerText = 'Starting...';
            try {
                const resp = await fetch('/diet/api/generate-plan/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ meal_count: mealCount, snack_count: snackCount, start_date: startDate })
                });
                const data = await resp.json();
                document.getElementById('result').textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                document.getElementById('result').textContent = 'Error starting task: ' + e;
            } finally {
                btn.disabled = false;
                btn.innerText = 'Generate (Async)';
            }
        }
    </script>
</head>
<body>
    <div class="card">
        <h2>Generate Diet Plan</h2>
        <p class="muted">Authenticated as: {{ user.username }}</p>
        <form onsubmit="submitGenerate(event)">
            <div class="row">
                <div style="flex:1">
                    <label for="meal_count">Meals</label>
                    <input id="meal_count" name="meal_count" type="number" min="1" max="6" value="3" />
                </div>
                <div style="flex:1">
                    <label for="snack_count">Snacks</label>
                    <input id="snack_count" name="snack_count" type="number" min="0" max="3" value="0" />
                </div>
            </div>
            <div class="row">
                <div style="flex:1">
                    <label for="start_date">Start Date (YYYY-MM-DD)</label>
                    <input id="start_date" name="start_date" type="text" placeholder="optional" />
                </div>
            </div>
            <button id="submit_btn" type="submit">Generate (Async)</button>
        </form>
        <pre id="result" style="margin-top:1rem; background:#f9fafb; padding:1rem; border-radius:8px; overflow:auto;"></pre>
    </div>
</body>
</html>
